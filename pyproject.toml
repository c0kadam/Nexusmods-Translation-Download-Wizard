[project]
name = "modlist-translation-wizard"
version = "0.2.0"
description = "Curated translation installer for supported Skyrim modlists."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "c0kadam" },
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "customtkinter>=5.2,<6",
    "modlist-translate-tool>=0.1.0,<0.2.0",
]

[project.urls]
Homepage = "https://github.com/c0kadam/Nexusmods-Translation-Download-Wizard"
Repository = "https://github.com/c0kadam/Nexusmods-Translation-Download-Wizard"

[project.optional-dependencies]
build = [
    "nuitka>=2.7,<3",
    "ordered-set>=4.1,<5",
    "pytest>=8,<9",
    "zstandard>=0.23,<1",
]

[project.scripts]
modlist-translation-wizard = "modlist_translation_wizard.installer_gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "../Modlist Translate Tool/src",
]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 100
target-version = "py311"
